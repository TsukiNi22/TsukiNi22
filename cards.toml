# Cards of the profile README: one [[card]] per project, rendered in assets/ by scripts/cards.py
#
# kind = "large" (2 per row), "small" (3 per row) or "row" (one line of the list, in order)
# pin = true: also a small copy <id>-pin for the Pinned section
# universe = name of the package in my-universe: version, pre-release, formats and category are read from its index.json

[profile]
name = "Tsukini"
subtitle = "🍦 アイスクリームと申します"
tagline = "C++20 libraries · Linux tooling · Low-level & embedded dev"
universe = "https://tsukini22.github.io/my-universe/index.json"
snake = "https://raw.githubusercontent.com/TsukiNi22/TsukiNi22/output"   # Contribution snake of the workflow
snake_branch = "output"                         # Branch of the snake: the activity section shows once it exists

