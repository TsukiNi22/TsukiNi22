name: Profile - Cards (CI/CD)

on:
  schedule:
    - cron: '30 0 * * 1' # every Monday at 00:30 UTC, 30 min after the daily update of my-universe (00:00 UTC)
  workflow_dispatch:
  push:
    branches: [main] # every push (the commits of the workflow itself use GITHUB_TOKEN: no loop)

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Render the banner, the cards and the activity panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/cards.py

      - name: Commit the new cards
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "✓ assets unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -q -m "chore(cards): update the versions"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "✓ cards committed"
