name: Profile - Cards (CI/CD)

on:
  schedule:
    - cron: '30 0 * * 1' # every Monday at 00:30 UTC, 30 min after the daily update of my-universe (00:00 UTC)
  workflow_dispatch:
  push:
    branches: [main] # every push (the commits of the workflow itself use GITHUB_TOKEN: no loop)

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#5b74ff&color_dots=#161b22,#1b2560,#24339a,#3550d8,#5b74ff

      - name: Push the snake on the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cards:
    needs: snake
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Render the banner, the cards and the README
        run: |
          set -euo pipefail
          python3 scripts/cards.py --readme

      - name: Commit the new cards
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets README.md)" ]; then
            echo "✓ assets and README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -q -m "chore(cards): update the versions"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "✓ cards committed"
